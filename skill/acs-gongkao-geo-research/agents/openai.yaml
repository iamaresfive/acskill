interface:
  display_name: "公考机构 GEO 调研 v2.1.1"
  short_description: "强化本土机构/IP召回、报告完整性与响应式咨询报告"
  default_prompt: "使用 $acs-gongkao-geo-research v2.1.1 开展公考 GEO 调研。先只确认尚未提供的地区、指定关注主体、正式输出格式。地区全景在六路 Semantic Discovery 之外，必须完成 local-institution-ecosystem、local-expert-ip、platform-native-ip 三组 Local Ecosystem Recall Audit；Semantic Coverage、Saturation、Local Ecosystem 三道门全部通过后才能冻结 Candidate Pool。Discovery/机构 Measurement/IP Measurement/Verification 严格隔离，指定主体只保证调查不加分，五维权重保持 30/25/20/15/10。evidence-insufficient/unresolved 不得静默消失，IP Measurement 必须进入 Report Model 与正式报告。只运行用户选择的 Renderer，并完成 Research、Report Model、Renderer、Visual QA 四层验收。"

policy:
  allow_implicit_invocation: true
