name: Retire GEO skill cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retire-geo-skill.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete v2.2 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2 >/dev/null 2>&1; then
            gh release delete v2.2 --cleanup-tag --yes
          fi
          git push origin :refs/tags/v2.2 || true

      - name: Delete GEO-related remote branches
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | grep -E '(geo|gongkao|v2\.2\.1|^docs/getting-started-guide$)' \
            > /tmp/retired-branches.txt || true

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            git push origin --delete "$branch"
          done < /tmp/retired-branches.txt

      - name: Verify cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2 >/dev/null 2>&1; then
            echo 'v2.2 release still exists' >&2
            exit 1
          fi
          if git ls-remote --tags origin | grep -F 'refs/tags/v2.2' >/dev/null; then
            echo 'v2.2 tag still exists' >&2
            exit 1
          fi
          if git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -E '(geo|gongkao|v2\.2\.1|^docs/getting-started-guide$)' >/dev/null; then
            echo 'GEO-related branch still exists' >&2
            exit 1
          fi

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/retire-geo-skill.yml
          git commit -m 'Remove one-time retirement workflow'
          git push origin HEAD:main
